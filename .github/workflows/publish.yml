name: publish

on:
  push:
    tags:
      - 'v*'  # Trigger only when pushing version tags like v0.2.0

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -oE '__version__ = "[^"]+"' seisviz/__init__.py | cut -d'"' -f2)
          echo "tag=$tag package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match __version__ $pkg. Bump seisviz/__init__.py before tagging."
            exit 1
          fi

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing; no stored token

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.2
