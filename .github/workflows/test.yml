name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: pytest -q

  test-min-versions:
    name: Declared dependency floor (numpy 1.21, matplotlib 3.5)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install at the declared minimum versions
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "numpy==1.21.*" "matplotlib==3.5.*"

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: pytest -q
